[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "mapseq-processing"
version = "1.0.0"

description = "Data processing for MAPseq"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "BSD-3-Clause"
license-files = ["LICEN[CS]E*"]
authors = [
  { name="John Hover", email="hover@cshl.edu" },
]

requires-python = ">= 3.9"

dependencies = [
 	"biopython",
 	"bowtie",
  	"dask", 
 	"fastcluster",
 	"h5py",
 	"matplotlib",
 	"mergedeep",
 	"natsort",
 	"networkx",
 	"openpyxl", 
 	"paramiko",
	"pandas", 
 	"pyarrow", 
 	"numpy", 
 	"scikit-learn", 
 	"scipy",
 	"seaborn", 
]

[tool.setuptools.packages.find]
include = ["mapseq*"]

[project.scripts]
'process_fastq_pairs.py' = "mapseq.cli:process_fastq_pairs" 
'process_fastq_pairs_concat.py' = "mapseq.cli:process_fastq_pairs_concat"
'aggregate_reads_byfile.py' = "mapseq.cli:aggregate_reads_byfile"
'aggregate_reads.py' = "mapseq.cli:aggregate_reads"
'merge_mapseq_dfs.py' = "mapseq.cli:merge_mapseq_dfs"

'align_collapse.py' = "mapseq.cli:align_collapse"



[project.urls]
Homepage = "https://github.com/ZadorLaboratory/mapseq-processing"
Issues = "https://github.com/ZadorLaboratory/mapseq-processing/issues"